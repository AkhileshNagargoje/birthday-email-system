<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in · Birthday Email System</title>
<style>
  :root {
    --page: #eeeef0; --panel: #ffffff; --sunk: #f7f7f8;
    --ink: #111113; --ink-3: #5f6065; --ink-4: #74757a;
    --line: #e2e2e5; --line-2: #cfcfd4;
    --lift-2: 0 2px 4px rgba(17,17,19,.09), 0 8px 24px rgba(17,17,19,.06);
    --edge: inset 0 1px 0 rgba(255,255,255,.95);
    --groove: inset 0 1px 2px rgba(17,17,19,.09);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--page); color: var(--ink); padding: 24px;
    font: 15px/1.6 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%; max-width: 340px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--lift-2), var(--edge); padding: 30px 28px;
  }
  h1 { margin: 0 0 4px; font-size: 18px; }
  .sub { margin: 0 0 22px; font-size: 13px; color: var(--ink-4); }
  label {
    display: block; font-size: 10.5px; font-weight: 500; text-transform: uppercase;
    letter-spacing: .08em; color: var(--ink-4); margin-bottom: 6px;
  }
  input {
    font: inherit; font-size: 14px; width: 100%; padding: 8px 11px;
    border-radius: 7px; border: 1px solid var(--line-2);
    background: var(--sunk); color: var(--ink); box-shadow: var(--groove);
    margin-bottom: 14px;
  }
  input:focus { outline: none; background: #fff; border-color: var(--ink-3);
                box-shadow: var(--groove), 0 0 0 3px rgba(17,17,19,.1); }
  button {
    font: inherit; font-size: 14px; font-weight: 500; width: 100%;
    padding: 9px; border-radius: 7px; cursor: pointer; color: #fff;
    border: 1px solid #000; background: linear-gradient(180deg, #34343a, #111113);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 1px 2px rgba(17,17,19,.3);
  }
  button:active { box-shadow: inset 0 2px 5px rgba(0,0,0,.5); }
  .error {
    margin: 0 0 14px; font-size: 13px; padding: 9px 12px; border-radius: 7px;
    background: var(--sunk); box-shadow: var(--groove);
    border-left: 3px solid var(--ink);
  }
</style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <h1>Birthday Email System</h1>
    <p class="sub">Sign in to manage the roster.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" autofocus required>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
