name: Test send

# A throwaway workflow for checking delivery to specific addresses.
#
# Deliberately separate from birthday.yml: it does not read the roster, does
# not touch the sent log, and cannot interfere with the real daily send. Delete
# this file once delivery is confirmed.

on:
  schedule:
    # 18:33 UTC = 00:03 IST (midnight). An odd minute on purpose: :00 and :30
    # are the most contended slots on GitHub's free tier, so they queue longest.
    #
    # Note midnight IST is 18:33 UTC the PREVIOUS day.
    #
    # READ THIS BEFORE LEAVING IT RUNNING. Unlike the birthday job, this one
    # has no date check and no duplicate guard - it sends to everybody on the
    # list EVERY evening, forever. That is fine for a day or two of testing,
    # and corrosive after that: identical mail arriving daily is exactly what
    # teaches Gmail a sender is spam, and it was days of work to recover from
    # that once already.
    #
    # Delete these two lines once the test is done.
    - cron: '33 18 * * *'

  workflow_dispatch:
    inputs:
      recipients:
        description: 'Addresses, comma separated. Blank = the usual three.'
        required: false
        default: ''
      names:
        description: 'Names, comma separated, in the same order.'
        required: false
        default: ''

jobs:
  send:
    runs-on: ubuntu-latest

    env:
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME }}
      REPLY_TO: ${{ vars.REPLY_TO }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      POSTER_MODE: ${{ vars.POSTER_MODE }}
      # No REPORT_EMAIL: a one-off wish sends no run report, and the workflow
      # log already says what happened.
      SOURCE_TYPE: csv
      SOURCE_PATH: data/students.csv

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet Pillow python-dotenv openpyxl

      - name: Send the test greetings
        # --wish takes a comma-separated list and pairs it with the names in
        # the same order. It ignores the roster and today's date entirely.
        # Inputs come through the environment so an address or name containing
        # quotes cannot break - or become - the command line.
        env:
          RECIPIENTS: ${{ github.event.inputs.recipients }}
          NAMES: ${{ github.event.inputs.names }}
        run: |
          DEFAULT_TO="suvarnanagargoje86@gmail.com"
          DEFAULT_NAMES="Suvarna"

          TO="${RECIPIENTS:-$DEFAULT_TO}"
          # Only pair the default names with the default addresses.
          if [ -n "$NAMES" ]; then
            WHO="$NAMES"
          elif [ -z "$RECIPIENTS" ]; then
            WHO="$DEFAULT_NAMES"
          else
            WHO=""
          fi

          set -- --wish "$TO"
          if [ -n "$WHO" ]; then set -- "$@" --wish-name "$WHO"; fi
          python -m src.main "$@"
