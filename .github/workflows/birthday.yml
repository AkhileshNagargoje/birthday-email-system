name: Birthday wishes

on:
  # THE CLOUD IS NOW THE SENDER. This runs on GitHub's machines, so the PC
  # can be switched off. The Windows task has been disabled to match -
  # running both would wish everyone twice, since the two keep separate
  # sent-logs and cannot see each other.
  #
  # To hand sending back to the PC:
  #   1. comment out the two lines below
  #   2. schtasks /change /tn "Birthday Email System" /enable
  schedule:
    - cron: '30 2 * * *'   # 02:30 UTC = 08:00 IST

  # Lets you run it by hand from the Actions tab.
  workflow_dispatch:
    inputs:
      pretend_date:
        description: 'Run as if today were this date (YYYY-MM-DD). Blank = today.'
        required: false
        default: ''
      dry_run:
        description: 'Test only - send nothing'
        type: boolean
        default: false
      check_login:
        description: 'Only check the mail login works, then stop'
        type: boolean
        default: false

# Needed so the run can push the updated sent log back.
permissions:
  contents: write

jobs:
  wish:
    runs-on: ubuntu-latest

    env:
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME }}
      REPLY_TO: ${{ vars.REPLY_TO }}
      REPORT_EMAIL: ${{ vars.REPORT_EMAIL }}
      REPORT_ALWAYS: ${{ vars.REPORT_ALWAYS }}
      TEST_EMAIL: ${{ vars.TEST_EMAIL }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      POSTER_MODE: ${{ vars.POSTER_MODE }}
      SOURCE_TYPE: csv
      SOURCE_PATH: data/students.csv
      # No .env file exists in the repo, so these environment values are what
      # the script reads. That keeps the password out of the codebase.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # Only what the send needs - the dashboard is not used here.
        run: pip install --quiet Pillow python-dotenv openpyxl

      - name: Check the mail login only
        if: github.event.inputs.check_login == 'true'
        run: python -m src.main --check-login

      - name: Check the roster before sending
        if: github.event.inputs.check_login != 'true'
        run: python -m src.main --validate
        continue-on-error: true

      - name: Send birthday wishes
        if: github.event.inputs.check_login != 'true'
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.pretend_date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.pretend_date }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python -m src.main $ARGS

      - name: Record that the run happened
        # Pushing the log back is what stops a second run of the same day
        # from wishing everyone twice.
        # Runs on dry runs too: a dry run writes no sent-log entries, so only
        # the timestamp changes, and it proves the push-back path works.
        if: always() && github.event.inputs.check_login != 'true'
        run: |
          # Pushing the sent log back is what stops a second run of the same
          # day from wishing everyone twice.
          #
          # last_run.txt is written on EVERY run, birthdays or not. That keeps
          # the repository active: GitHub switches scheduled workflows off
          # after 60 days of inactivity, and a roster with few birthdays would
          # otherwise go quiet long enough to trip it.
          date -u +"%Y-%m-%dT%H:%M:%SZ" > logs/last_run.txt

          git config user.name  "birthday-bot"
          git config user.email "actions@github.com"
          git add logs/last_run.txt logs/sent_log.csv

          if git diff --cached --quiet; then
            echo "Nothing to record."
          else
            git commit -m "Birthday run $(date -u +%Y-%m-%d)"
            git push
          fi
